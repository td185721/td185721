<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of a binary</title>
  <desc id="d">The section layout of a Windows PE file and a Linux ELF file, with lines from each structure to the tool that reads it: pe-walker, pe-diff, rtti-dump and vtable-dump on Windows, unwind-map on Linux, and pattern-scan for code on both.</desc>
  <style>
    text { font-family: ui-monospace, 'JetBrains Mono', 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .flow { fill: none; stroke-dasharray: 2 12; stroke-linecap: round; animation: flow 1.4s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1c2128"/></pattern>
    <radialGradient id="glow" cx="600" cy="320" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79c0ff" stop-opacity="0.06"/><stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#ffa657"/><stop offset="0.55" stop-color="#79c0ff"/><stop offset="1" stop-color="#79c0ff" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="600" rx="16"/></clipPath>
  </defs>
